name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake-dark.svg and snake-light.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0A101F,#0e4a5c,#12849e,#22D3EE,#A78BFA
            dist/snake-light.svg?palette=github-light&color_snake=#0891B2&color_dots=#EBEDF0,#c7e9f0,#7fd0e0,#0891B2,#7C3AED

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
