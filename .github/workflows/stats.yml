name: Refresh Stats & Snake

# Stats kartasi ham, ilon animatsiyasi ham shu repodagi Python skriptlar bilan
# yasaladi — tashqi action yoki servisga bog'liq emas.

on:
  schedule:
    - cron: "17 3 * * *"   # har kuni 03:17 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - make_stats.py
      - make_snake.py
      - .github/workflows/stats.yml

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python make_stats.py

      - name: Rebuild snake animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python make_snake.py

      - name: Commit if changed
        run: |
          files="stats-dark.svg stats-light.svg snake-dark.svg snake-light.svg"
          if [ -n "$(git status --porcelain $files)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "chore: refresh stats card and snake animation"
            git push
          else
            echo "Nothing changed."
          fi
